<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" font-family="sans-serif" font-size="15" fill="none" stroke="#222" stroke-width="1.5">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222" stroke="none"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b" stroke="none"/>
    </marker>
  </defs>
  <!-- master body (below the master segment) -->
  <path d="M40,190 L480,150 L480,270 L40,270 z" fill="#222" fill-opacity="0.06" stroke="none"/>
  <!-- master segment and its nodes -->
  <line x1="40" y1="190" x2="480" y2="150" stroke-width="2.5"/>
  <circle cx="90" cy="185.5" r="5" fill="#222"/>
  <circle cx="430" cy="154.5" r="5" fill="#222"/>
  <text x="48" y="212" fill="#222" stroke="none">master node 1</text>
  <text x="384" y="182" fill="#222" stroke="none">master node 2</text>
  <text x="222" y="250" fill="#222" stroke="none">master body</text>
  <!-- slave surface (the body above), which penetrates the master segment -->
  <path d="M60,105 C170,105 215,198 272,198 C330,198 375,105 500,95" stroke-dasharray="6 4"/>
  <text x="392" y="84" fill="#222" stroke="none">slave surface</text>
  <!-- slave node s, below the master segment -->
  <circle cx="272" cy="198" r="5.5" fill="#c0392b" stroke="#c0392b"/>
  <text x="272" y="222" fill="#c0392b" stroke="none" text-anchor="middle">s</text>
  <!-- the gap between s and its projection -->
  <line x1="269.7" y1="173" x2="271.6" y2="193" stroke="#c0392b" stroke-width="2"/>
  <text x="277" y="188" fill="#c0392b" stroke="none">g</text>
  <!-- outward normal n of the master facet and unit tangent tau -->
  <line x1="269.4" y1="169.2" x2="262.6" y2="94.5" marker-end="url(#a)"/>
  <text x="254" y="100" fill="#222" stroke="none" text-anchor="end">n</text>
  <line x1="269.4" y1="169.2" x2="349.1" y2="162" marker-end="url(#a)"/>
  <text x="340" y="151" fill="#222" stroke="none">τ</text>
  <!-- the projection x(xi) of s on the segment -->
  <circle cx="269.4" cy="169.2" r="4" fill="#fff"/>
  <text x="256" y="148" fill="#222" stroke="none" text-anchor="end">x(ξ)</text>
  <!-- normal contact force on the slave node -->
  <line x1="300" y1="194" x2="294.4" y2="132.3" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <text x="303" y="128" fill="#c0392b" stroke="none">f<tspan dy="4" font-size="11">N</tspan><tspan dy="-4"> on s</tspan></text>
</svg>

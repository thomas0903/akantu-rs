<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="sans-serif" font-size="14" fill="none" stroke="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222" stroke="none"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b" stroke="none"/>
    </marker>
  </defs>
  <!-- area under the envelope: G_c -->
  <path d="M60,240 L110,70 L400,240 z" fill="#c0392b" fill-opacity="0.08" stroke="none"/>
  <!-- axes -->
  <line x1="40" y1="240" x2="455" y2="240" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="260" x2="60" y2="25" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="458" y="262" fill="#222" stroke="none" font-style="italic">δ</text>
  <text x="68" y="28" fill="#222" stroke="none" font-style="italic">T</text>
  <!-- envelope: elastic part then linear softening -->
  <polyline points="60,240 110,70 400,240" stroke-width="2"/>
  <!-- unloading / reloading secant from delta_max -->
  <line x1="60" y1="240" x2="260" y2="157.9" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="205" y1="160" x2="155" y2="181" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <!-- guides -->
  <line x1="60" y1="70" x2="110" y2="70" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="110" y1="70" x2="110" y2="240" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="260" y1="157.9" x2="260" y2="240" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="157.9" x2="260" y2="157.9" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- loading arrow along the softening branch -->
  <line x1="290" y1="140" x2="345" y2="172" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- labels -->
  <text x="22" y="75" fill="#222" stroke="none"><tspan font-style="italic">σ</tspan><tspan font-size="10" dy="3">c</tspan></text>
  <text x="10" y="162" fill="#222" stroke="none"><tspan font-style="italic">T</tspan><tspan font-size="10" dy="3">max</tspan></text>
  <text x="102" y="258" fill="#222" stroke="none"><tspan font-style="italic">δ</tspan><tspan font-size="10" dy="3">0</tspan></text>
  <text x="246" y="258" fill="#222" stroke="none"><tspan font-style="italic">δ</tspan><tspan font-size="10" dy="3">max</tspan></text>
  <text x="394" y="258" fill="#222" stroke="none"><tspan font-style="italic">δ</tspan><tspan font-size="10" dy="3">c</tspan></text>
  <text x="200" y="228" fill="#222" stroke="none"><tspan font-style="italic">G</tspan><tspan font-size="10" dy="3">c</tspan></text>
  <text x="300" y="120" fill="#222" stroke="none" font-size="12">loading</text>
  <text x="120" y="205" fill="#c0392b" stroke="none" font-size="12" transform="rotate(-22 120 205)">unloading</text>
  <text x="114" y="150" fill="#222" stroke="none" font-size="12">elastic</text>
</svg>

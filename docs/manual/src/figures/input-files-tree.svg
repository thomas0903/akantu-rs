<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" font-family="sans-serif" font-size="13" fill="#222">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <!-- root -->
  <rect x="170" y="15" width="260" height="88" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="36" text-anchor="middle" font-weight="bold">global (root section)</text>
  <line x1="180" y1="45" x2="420" y2="45" stroke="#222" stroke-width="0.8"/>
  <text x="185" y="66" font-family="monospace" font-size="12">spatial_dimension = 2</text>
  <text x="185" y="88" font-family="monospace" font-size="12">lactostatic_p = 30e3</text>
  <!-- children -->
  <rect x="20" y="170" width="260" height="140" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="191" text-anchor="middle" font-weight="bold">user parameters</text>
  <text x="150" y="207" text-anchor="middle" font-size="11">type user, name parameters</text>
  <line x1="30" y1="215" x2="270" y2="215" stroke="#222" stroke-width="0.8"/>
  <text x="35" y="236" font-family="monospace" font-size="12">mesh_file = swiss_cheese.msh</text>
  <text x="35" y="256" font-family="monospace" font-size="12">stress = [[…], […]]</text>
  <text x="35" y="276" font-family="monospace" font-size="12">max_nb_iterations = 100</text>
  <text x="35" y="296" font-family="monospace" font-size="12">precision = 1e-9</text>
  <rect x="320" y="170" width="260" height="140" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="450" y="191" text-anchor="middle" font-weight="bold">material elastic</text>
  <text x="450" y="207" text-anchor="middle" font-size="11">type material, name elastic</text>
  <line x1="330" y1="215" x2="570" y2="215" stroke="#222" stroke-width="0.8"/>
  <text x="335" y="236" font-family="monospace" font-size="12">name = cheese</text>
  <text x="335" y="256" font-family="monospace" font-size="12">rho  = 1.2e3</text>
  <text x="335" y="276" font-family="monospace" font-size="12">E    = 2*lactostatic_p</text>
  <text x="335" y="296" font-family="monospace" font-size="12">nu   = 0.3</text>
  <!-- tree edges -->
  <line x1="260" y1="103" x2="150" y2="170" stroke="#222" stroke-width="1.5"/>
  <line x1="340" y1="103" x2="450" y2="170" stroke="#222" stroke-width="1.5"/>
  <!-- scope lookup -->
  <path d="M 500 268 C 560 240, 520 110, 432 86" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="515" y="140" fill="#c0392b" font-size="12" text-anchor="end">found in the</text>
  <text x="515" y="155" fill="#c0392b" font-size="12" text-anchor="end">parent section</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="sans-serif" fill="none" stroke="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222" stroke="none"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b" stroke="none"/>
    </marker>
  </defs>
  <!-- the body -->
  <path d="M110,70 C150,30 260,30 300,80 C335,125 330,195 280,230 C235,262 160,262 135,225 C120,200 150,170 125,150 C95,128 80,100 110,70 z" fill="#222" fill-opacity="0.08" stroke-width="2.5"/>
  <!-- Dirichlet boundary: hatching along the top-left part -->
  <path d="M110,70 C150,30 260,30 300,80" stroke-width="4"/>
  <g stroke-width="1.2">
    <line x1="112" y1="66" x2="100" y2="54"/>
    <line x1="128" y1="54" x2="116" y2="42"/>
    <line x1="146" y1="45" x2="134" y2="33"/>
    <line x1="165" y1="40" x2="153" y2="28"/>
    <line x1="185" y1="37" x2="173" y2="25"/>
    <line x1="205" y1="37" x2="193" y2="25"/>
    <line x1="225" y1="39" x2="213" y2="27"/>
    <line x1="245" y1="44" x2="233" y2="32"/>
    <line x1="264" y1="51" x2="252" y2="39"/>
    <line x1="281" y1="61" x2="269" y2="49"/>
    <line x1="296" y1="75" x2="284" y2="63"/>
  </g>
  <!-- Neumann boundary: traction arrows on the lower right -->
  <g stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow-accent)">
    <line x1="370" y1="140" x2="333" y2="140"/>
    <line x1="368" y1="168" x2="330" y2="172"/>
    <line x1="360" y1="196" x2="320" y2="203"/>
    <line x1="345" y1="223" x2="302" y2="226"/>
  </g>
  <!-- outward normal on the free part of the boundary -->
  <line x1="126" y1="152" x2="82" y2="168" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- coordinate axes -->
  <g stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="30" y1="280" x2="80" y2="280"/>
    <line x1="30" y1="280" x2="30" y2="230"/>
  </g>
  <g fill="#222" stroke="none" font-size="17">
    <text x="205" y="150" font-size="24" font-style="italic">Ω</text>
    <text x="170" y="20" font-style="italic">Γ<tspan font-size="12" dy="5">u</tspan><tspan dy="-5" font-style="normal">: </tspan><tspan font-weight="bold">u</tspan><tspan font-style="normal"> = </tspan><tspan font-weight="bold">ū</tspan></text>
    <text x="300" y="262" font-style="italic">Γ<tspan font-size="12" dy="5">t</tspan></text>
    <text x="374" y="178" fill="#c0392b" font-weight="bold">t̄</text>
    <text x="64" y="186" font-weight="bold">n</text>
    <text x="84" y="285" font-size="14" font-style="italic">x</text>
    <text x="22" y="224" font-size="14" font-style="italic">y</text>
  </g>
</svg>

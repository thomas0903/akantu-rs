<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" font-family="sans-serif" font-size="13" fill="#222">
  <!-- unit square: x in [60, 300], y in [290, 50] (240 px per unit) -->
  <polygon points="60,290 300,290 300,50 60,50" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="60" y1="290" x2="300" y2="50" stroke="#222" stroke-width="1.5"/>
  <text x="230" y="266" text-anchor="middle">element 0</text>
  <text x="230" y="281" text-anchor="middle" font-size="11">nodes 0, 1, 2</text>
  <text x="120" y="110" text-anchor="middle">element 1</text>
  <text x="120" y="126" text-anchor="middle" font-size="11">nodes 0, 2, 3</text>
  <!-- bar at y = 0.25 -->
  <line x1="60" y1="230" x2="120" y2="230" stroke="#c0392b" stroke-width="4"/>
  <line x1="120" y1="230" x2="300" y2="230" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 4"/>
  <circle cx="60" cy="230" r="4" fill="#c0392b"/>
  <circle cx="120" cy="230" r="4.5" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <circle cx="300" cy="230" r="4" fill="#c0392b"/>
  <text x="90" y="222" text-anchor="middle" font-size="12">piece 0</text>
  <text x="270" y="222" text-anchor="middle" font-size="12">piece 1</text>
  <text x="128" y="246" font-size="12">(0.25, 0.25)</text>
  <!-- node numbers -->
  <text x="52" y="306" text-anchor="end" font-size="12">node 0</text>
  <text x="308" y="306" font-size="12">node 1</text>
  <text x="308" y="46" font-size="12">node 2</text>
  <text x="52" y="46" text-anchor="end" font-size="12">node 3</text>
  <!-- axes -->
  <line x1="60" y1="290" x2="60" y2="20" stroke="#222" stroke-width="0.8"/>
  <line x1="60" y1="290" x2="340" y2="290" stroke="#222" stroke-width="0.8"/>
  <text x="346" y="294">x</text>
  <text x="64" y="20">y</text>
  <text x="34" y="234" text-anchor="end" font-size="12">0.25</text>
  <line x1="40" y1="230" x2="56" y2="230" stroke="#222" stroke-width="0.8"/>
  <!-- legend -->
  <line x1="320" y1="120" x2="350" y2="120" stroke="#c0392b" stroke-width="4"/>
  <text x="356" y="124" font-size="12">query</text>
  <text x="356" y="140" font-size="12">segment</text>
</svg>

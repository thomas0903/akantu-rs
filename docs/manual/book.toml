# akantu-rs user manual (mdBook). Build with `mdbook build docs/manual`;
# not a dependency of the Rust workspace. The Rust examples are doc-tests of
# the facade crate (`cargo test -p akantu --doc`), the input snippets, the
# generated tables and the links are checked by
# `cargo test -p akantu --test manual`.

[book]
title = "akantu-rs user manual"
authors = ["akantu-rs contributors", "Akantu authors (EPFL/LSMS), upstream manual"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
mathjax-support = false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' role="img"><title>Life of a work package (one agent&#x27;s task: parity rows and a brief)</title><defs><marker id="ah-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker><marker id="ah-52514e-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#52514e"/></marker></defs><rect width="760" height="520" fill="#ffffff"/><rect x="9" y="14" width="150" height="76" rx="6" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="84.0" y="33.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Inventory</text><text x="84.0" y="51.2" text-anchor="middle" font-size="11" fill="#52514e">C++ tree read; one parity</text><text x="84.0" y="65.3" text-anchor="middle" font-size="11" fill="#52514e">row per feature, test,</text><text x="84.0" y="79.4" text-anchor="middle" font-size="11" fill="#52514e">example</text><rect x="206" y="14" width="150" height="76" rx="6" fill="#fcecf3" stroke="#e87ba4" stroke-width="1.2"/><text x="281.0" y="33.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Brief</text><text x="281.0" y="51.2" text-anchor="middle" font-size="11" fill="#52514e">rows, scope, acceptance</text><text x="281.0" y="65.3" text-anchor="middle" font-size="11" fill="#52514e">criteria, evidence,</text><text x="281.0" y="79.4" text-anchor="middle" font-size="11" fill="#52514e">owned files</text><rect x="403" y="14" width="150" height="76" rx="6" fill="#e3f5ee" stroke="#1baf7a" stroke-width="1.2"/><text x="478.0" y="33.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Implementation</text><text x="478.0" y="51.2" text-anchor="middle" font-size="11" fill="#52514e">own worktree: Rust</text><text x="478.0" y="65.3" text-anchor="middle" font-size="11" fill="#52514e">code, oracle probes,</text><text x="478.0" y="79.4" text-anchor="middle" font-size="11" fill="#52514e">fixtures, tests</text><rect x="600" y="14" width="150" height="76" rx="6" fill="#e3f5ee" stroke="#1baf7a" stroke-width="1.2"/><text x="675.0" y="33.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Author&#x27;s gate</text><text x="675.0" y="51.2" text-anchor="middle" font-size="11" fill="#52514e">fmt, clippy, tests, MPI</text><text x="675.0" y="65.3" text-anchor="middle" font-size="11" fill="#52514e">tiers on boat.dev;</text><text x="675.0" y="79.4" text-anchor="middle" font-size="11" fill="#52514e">report</text><rect x="600" y="128" width="150" height="76" rx="6" fill="#ecebfa" stroke="#6250d6" stroke-width="1.2"/><text x="675.0" y="147.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">First review</text><text x="675.0" y="165.2" text-anchor="middle" font-size="11" fill="#52514e">fresh agent reruns the</text><text x="675.0" y="179.3" text-anchor="middle" font-size="11" fill="#52514e">gates, regenerates</text><text x="675.0" y="193.4" text-anchor="middle" font-size="11" fill="#52514e">fixtures, tries to break it</text><polygon points="478.0,131.0 528.0,166.0 478.0,201.0 428.0,166.0" fill="#ecebfa" stroke="#6250d6" stroke-width="1.2"/><text x="478.0" y="170.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a19">Verdict</text><rect x="206" y="128" width="150" height="76" rx="6" fill="#e3f5ee" stroke="#1baf7a" stroke-width="1.2"/><text x="281.0" y="154.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Fix round</text><text x="281.0" y="172.2" text-anchor="middle" font-size="11" fill="#52514e">blocking and major</text><text x="281.0" y="186.3" text-anchor="middle" font-size="11" fill="#52514e">findings (from 12 Nov)</text><rect x="27" y="248" width="132" height="76" rx="6" fill="#1a1a19" stroke="#1a1a19" stroke-width="1.2"/><text x="93.0" y="267.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">The user</text><text x="93.0" y="285.2" text-anchor="middle" font-size="11" fill="#d9d8d2">approves exceptions,</text><text x="93.0" y="299.3" text-anchor="middle" font-size="11" fill="#d9d8d2">scope, budgets;</text><text x="93.0" y="313.4" text-anchor="middle" font-size="11" fill="#d9d8d2">never reviews code</text><rect x="403" y="248" width="150" height="76" rx="6" fill="#fcecf3" stroke="#e87ba4" stroke-width="1.2"/><text x="478.0" y="274.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Merge candidate</text><text x="478.0" y="292.2" text-anchor="middle" font-size="11" fill="#52514e">integration branch</text><text x="478.0" y="306.3" text-anchor="middle" font-size="11" fill="#52514e">on current main</text><rect x="600" y="248" width="150" height="76" rx="6" fill="#fcecf3" stroke="#e87ba4" stroke-width="1.2"/><text x="675.0" y="267.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Orchestrator&#x27;s gate</text><text x="675.0" y="285.2" text-anchor="middle" font-size="11" fill="#52514e">full chain on boat.dev;</text><text x="675.0" y="299.3" text-anchor="middle" font-size="11" fill="#52514e">parallel on Vultr</text><text x="675.0" y="313.4" text-anchor="middle" font-size="11" fill="#52514e">from 13 Nov</text><rect x="600" y="368" width="150" height="76" rx="6" fill="#fcecf3" stroke="#e87ba4" stroke-width="1.2"/><text x="675.0" y="387.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Merge and publish</text><text x="675.0" y="405.2" text-anchor="middle" font-size="11" fill="#52514e">row Verified with tests,</text><text x="675.0" y="419.3" text-anchor="middle" font-size="11" fill="#52514e">fixture, tolerance,</text><text x="675.0" y="433.4" text-anchor="middle" font-size="11" fill="#52514e">reviewer</text><rect x="403" y="368" width="150" height="76" rx="6" fill="#ecebfa" stroke="#6250d6" stroke-width="1.2"/><text x="478.0" y="387.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Batched re-check</text><text x="478.0" y="405.2" text-anchor="middle" font-size="11" fill="#52514e">after the merge, one</text><text x="478.0" y="419.3" text-anchor="middle" font-size="11" fill="#52514e">reviewer per three or</text><text x="478.0" y="433.4" text-anchor="middle" font-size="11" fill="#52514e">four branches</text><rect x="206" y="368" width="150" height="76" rx="6" fill="#f5f4f0" stroke="#b5b4ad" stroke-width="1.2" stroke-dasharray="3 3"/><text x="281.0" y="394.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#52514e">Backlog</text><text x="281.0" y="412.2" text-anchor="middle" font-size="11" fill="#52514e">minor findings,</text><text x="281.0" y="426.3" text-anchor="middle" font-size="11" fill="#52514e">cleared in batches</text><path d="M159.0,52.0 L206.0,52.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M356.0,52.0 L403.0,52.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M553.0,52.0 L600.0,52.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M675.0,90.0 L675.0,128.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M600.0,166.0 L528.0,166.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M478.0,131.0 L478.0,90.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M428.0,166.0 L356.0,166.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M478.0,201.0 L478.0,248.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M311.0,204.0 L311.0,286.0 L403.0,286.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M553.0,286.0 L600.0,286.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M675.0,324.0 L675.0,368.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M600.0,406.0 L553.0,406.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M637.5,324.0 L637.5,339.0 L251.0,339.0 L251.0,204.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M403.0,406.0 L356.0,406.0" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="5 4"  marker-end="url(#ah-52514e)"/><path d="M206.0,166.0 L22.0,166.0 L22.0,406.0 L206.0,406.0" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="5 4"  marker-end="url(#ah-52514e)"/><text x="484.0" y="114.5" text-anchor="start" font-size="11" fill="#52514e">reject</text><text x="392.0" y="146.2" text-anchor="middle" font-size="11" fill="#52514e">changes</text><text x="392.0" y="160.0" text-anchor="middle" font-size="11" fill="#52514e">required</text><text x="484.0" y="230.5" text-anchor="start" font-size="11" fill="#52514e">accept</text><text x="397.9" y="354.0" text-anchor="middle" font-size="11" fill="#52514e">fails</text><text x="379.5" y="384.2" text-anchor="middle" font-size="11" fill="#52514e">new</text><text x="379.5" y="398.0" text-anchor="middle" font-size="11" fill="#52514e">findings</text><text x="123.2" y="400.0" text-anchor="middle" font-size="11" fill="#52514e">minor findings</text><rect x="9" y="479" width="16" height="11" rx="2.5" fill="#fcecf3" stroke="#e87ba4" stroke-width="1.2"/><text x="31" y="488" font-size="11" fill="#52514e">orchestrator</text><rect x="116.76" y="479" width="16" height="11" rx="2.5" fill="#e3f5ee" stroke="#1baf7a" stroke-width="1.2"/><text x="138.76" y="488" font-size="11" fill="#52514e">author agent</text><rect x="221.44" y="479" width="16" height="11" rx="2.5" fill="#ecebfa" stroke="#6250d6" stroke-width="1.2"/><text x="243.44" y="488" font-size="11" fill="#52514e">reviewer agent</text><rect x="341.63" y="479" width="16" height="11" rx="2.5" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="363.63" y="488" font-size="11" fill="#52514e">inventory agents</text><rect x="467.87" y="479" width="16" height="11" rx="2.5" fill="#1a1a19" stroke="#1a1a19" stroke-width="1.2"/><text x="489.87" y="488" font-size="11" fill="#52514e">the user</text><text x="9" y="510.0" text-anchor="start" font-size="11" font-weight="400" fill="#52514e">Reviewers: GPT-6.1 Sol until 11 Nov, then fresh Opus 5.5 agents; re-checks Opus 5.5 at effort high.</text></svg>

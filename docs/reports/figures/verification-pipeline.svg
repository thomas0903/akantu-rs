<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' role="img"><title>How a feature of the port was verified</title><defs><marker id="ah-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker><marker id="ah-52514e-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#52514e"/></marker></defs><rect width="760" height="470" fill="#ffffff"/><rect x="8" y="8" width="744" height="116" rx="10" fill="#f5f4f0" stroke="none"/><text x="20" y="27" font-size="11" font-weight="700" letter-spacing="0.5" fill="#6f6e69">C++ REFERENCE (ORACLE)</text><rect x="8" y="140" width="744" height="160" rx="10" fill="#f5f4f0" stroke="none"/><text x="20" y="159" font-size="11" font-weight="700" letter-spacing="0.5" fill="#6f6e69">RUST PORT</text><rect x="8" y="316" width="744" height="146" rx="10" fill="#f5f4f0" stroke="none"/><text x="20" y="335" font-size="11" font-weight="700" letter-spacing="0.5" fill="#6f6e69">ACCEPTANCE</text><rect x="198" y="158" width="548" height="132" rx="10" fill="#ffffff" stroke="#d9d8d2"/><text x="210" y="177" font-size="11" font-weight="700" letter-spacing="0.5" fill="#6f6e69">TESTS</text><rect x="22" y="40" width="156" height="70" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/><text x="100.0" y="63.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Akantu C++ 35a85178</text><text x="100.0" y="81.2" text-anchor="middle" font-size="11" fill="#52514e">never edited; build patches</text><text x="100.0" y="95.3" text-anchor="middle" font-size="11" fill="#52514e">in oracle/patches/</text><rect x="208" y="40" width="156" height="70" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/><text x="286.0" y="63.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Strict build</text><text x="286.0" y="81.2" text-anchor="middle" font-size="11" fill="#52514e">in Docker: no FMA, scalar</text><text x="286.0" y="95.3" text-anchor="middle" font-size="11" fill="#52514e">Eigen, BLAS pinned</text><rect x="394" y="40" width="156" height="70" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/><text x="472.0" y="63.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Probes</text><text x="472.0" y="81.2" text-anchor="middle" font-size="11" fill="#52514e">C++ and Python programs</text><text x="472.0" y="95.3" text-anchor="middle" font-size="11" fill="#52514e">running upstream&#x27;s classes</text><rect x="580" y="40" width="156" height="70" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/><text x="658.0" y="63.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Golden fixtures</text><text x="658.0" y="81.2" text-anchor="middle" font-size="11" fill="#52514e">2,023 cases: manifest</text><text x="658.0" y="95.3" text-anchor="middle" font-size="11" fill="#52514e">and .npy arrays</text><rect x="22" y="198" width="156" height="80" rx="6" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.2"/><text x="100.0" y="226.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Rust implementation</text><text x="100.0" y="244.2" text-anchor="middle" font-size="11" fill="#52514e">same operation order,</text><text x="100.0" y="258.3" text-anchor="middle" font-size="11" fill="#52514e">no FMA, no fast-math</text><rect x="208" y="198" width="156" height="80" rx="6" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="286.0" y="219.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Ported upstream tests</text><text x="286.0" y="237.2" text-anchor="middle" font-size="11" fill="#52514e">182 TEST rows:</text><text x="286.0" y="251.3" text-anchor="middle" font-size="11" fill="#52514e">177 Verified,</text><text x="286.0" y="265.4" text-anchor="middle" font-size="11" fill="#52514e">5 exceptions</text><rect x="394" y="198" width="156" height="80" rx="6" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="472.0" y="219.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Independent checks</text><text x="472.0" y="237.2" text-anchor="middle" font-size="11" fill="#52514e">patch tests, closed</text><text x="472.0" y="251.3" text-anchor="middle" font-size="11" fill="#52514e">forms, convergence</text><text x="472.0" y="265.4" text-anchor="middle" font-size="11" fill="#52514e">orders, invariants</text><rect x="580" y="198" width="156" height="80" rx="6" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="658.0" y="219.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Differential tests</text><text x="658.0" y="237.2" text-anchor="middle" font-size="11" fill="#52514e">bit for bit where possible,</text><text x="658.0" y="251.3" text-anchor="middle" font-size="11" fill="#52514e">else a reviewed tolerance</text><text x="658.0" y="265.4" text-anchor="middle" font-size="11" fill="#52514e">(240 rules, 197 exact)</text><rect x="580" y="372" width="156" height="70" rx="6" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="658.0" y="395.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Independent review</text><text x="658.0" y="413.2" text-anchor="middle" font-size="11" fill="#52514e">by an agent that did</text><text x="658.0" y="427.3" text-anchor="middle" font-size="11" fill="#52514e">not write the code</text><rect x="394" y="372" width="156" height="70" rx="6" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="472.0" y="395.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Parity row Verified</text><text x="472.0" y="413.2" text-anchor="middle" font-size="11" fill="#52514e">tests, fixture, tolerance</text><text x="472.0" y="427.3" text-anchor="middle" font-size="11" fill="#52514e">reason, review</text><rect x="208" y="372" width="156" height="70" rx="6" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="286.0" y="395.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Merge gate, x86_64</text><text x="286.0" y="413.2" text-anchor="middle" font-size="11" fill="#52514e">fmt, clippy, every test,</text><text x="286.0" y="427.3" text-anchor="middle" font-size="11" fill="#52514e">MPI, MUMPS, PETSc tiers</text><rect x="22" y="372" width="156" height="70" rx="6" fill="#ffffff" stroke="#8f8e88" stroke-width="1.2"/><text x="100.0" y="395.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a19">Final campaign</text><text x="100.0" y="413.2" text-anchor="middle" font-size="11" fill="#52514e">the gate again, MPI to</text><text x="100.0" y="427.3" text-anchor="middle" font-size="11" fill="#52514e">8 ranks, 23 CI jobs</text><path d="M178.0,75.0 L208.0,75.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M364.0,75.0 L394.0,75.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M550.0,75.0 L580.0,75.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M658.0,110.0 L658.0,198.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M178.0,238.0 L198.0,238.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M658.0,278.0 L658.0,372.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M580.0,407.0 L550.0,407.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M394.0,407.0 L364.0,407.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M208.0,407.0 L178.0,407.0" fill="none" stroke="#52514e" stroke-width="1.3"  marker-end="url(#ah-52514e)"/><path d="M286.0,372.0 L286.0,342.0 L143.7,342.0 L143.7,278.0" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="5 4"  marker-end="url(#ah-52514e)"/><text x="664.0" y="140.4" text-anchor="start" font-size="11" fill="#52514e">read by</text><text x="664.0" y="331.0" text-anchor="start" font-size="11" fill="#52514e">evidence</text><text x="294.0" y="361.0" text-anchor="start" font-size="11" fill="#52514e">a failure blocks the merge</text></svg>

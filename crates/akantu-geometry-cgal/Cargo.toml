# SPDX-License-Identifier: GPL-3.0-or-later
# GPL-licensed crate (decision record D-042): contains Rust ports of CGAL's
# GPL-3.0-or-later packages AABB_tree, Circular_kernel_3 (spherical kernel)
# and Algebraic_kernel_for_spheres. Opt-in only (umbrella feature `cgal`,
# OFF by default); a build that includes it is distributed under
# GPL-3.0-or-later as a whole. See README.md.
[package]
name = "akantu-geometry-cgal"
description = "GPL-3.0-or-later part of the akantu-rs geometry port: CGAL AABB tree (upstream traversal order) and spherical kernel (sphere intersector)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
# The copyright notices of Akantu and CGAL are in each file and in NOTICE.md.
authors = ["The akantu-rs contributors", "Akantu authors (EPFL/LSMS) for the original C++ implementation", "CGAL authors (INRIA Sophia-Antipolis, GeometryFactory, ETH Zurich, ...) for the original CGAL code"]
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false

[dependencies]
akantu-core.workspace = true
akantu-mesh.workspace = true
akantu-geometry.workspace = true

[dev-dependencies]
akantu-validation.workspace = true  # oracle fixtures (fixtures/geometry)
akantu-io.workspace = true    # read the upstream test meshes
serde_json.workspace = true   # oracle differential fixtures

[lints]
workspace = true

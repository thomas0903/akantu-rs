# SPDX-License-Identifier: LGPL-3.0-or-later
[package]
name = "akantu-validation"
description = "Golden-fixture loading and differential comparison harness for validating akantu-rs against the Akantu C++ oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# All MIT OR Apache-2.0 (see docs/DEPENDENCIES.md). Versions pinned to what
# is available in the local registry cache.
serde = { version = "1.0.228", features = ["derive"] }
# float_roundtrip: as the workspace dependency
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[package]
name = "akantu-ntn-contact"
description = "Traction-at-split-node contact (port of extra_packages/traction-at-split-node-contact)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
# Real-MPI test binary mpi_ntn: scripts/mpi/run-par-tests.sh (Docker).
mpi = ["akantu-comm/mpi", "akantu-mesh/mpi"]
# Scotch partitioner of akantu-mesh (Docker image docker/scotch).
scotch = ["akantu-mesh/scotch"]

[dependencies]
akantu-core.workspace = true
akantu-comm.workspace = true
akantu-parser.workspace = true
akantu-mesh.workspace = true
akantu-fe.workspace = true
akantu-solver.workspace = true
akantu-model.workspace = true
akantu-solid.workspace = true
akantu-io.workspace = true
log.workspace = true

[dev-dependencies]
akantu-validation.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "mpi_ntn"
harness = false
required-features = ["mpi"]

# SPDX-License-Identifier: LGPL-3.0-or-later
[package]
name = "akantu-cohesive"
description = "SolidMechanicsModelCohesive, cohesive materials, cohesive element inserter, fragment manager (port of src/model/solid_mechanics/solid_mechanics_model_cohesive, src/mesh_utils/cohesive_element_inserter*)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
# Real-MPI test binary: scripts/mpi/run-par-tests.sh (Docker).
mpi = ["akantu-comm/mpi", "akantu-mesh/mpi", "akantu-solid/mpi"]
# Scotch partitioner of akantu-mesh (Docker image docker/scotch).
scotch = ["akantu-mesh/scotch", "akantu-solid/scotch"]

[dependencies]
akantu-core.workspace = true
akantu-parser.workspace = true
akantu-comm.workspace = true
akantu-mesh.workspace = true
akantu-fe.workspace = true
akantu-solver.workspace = true
akantu-linalg.workspace = true
akantu-model.workspace = true
akantu-solid.workspace = true
# the cohesive and facet dumpers (COH-013); akantu-solid already depends on it
akantu-io.workspace = true

[lints]
workspace = true

[dev-dependencies]
akantu-validation.workspace = true
serde_json.workspace = true

[[test]]
name = "mpi_cohesive"
harness = false
required-features = ["mpi"]

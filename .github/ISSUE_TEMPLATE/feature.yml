# SPDX-License-Identifier: LGPL-3.0-or-later
name: Feature request
description: Propose a new capability or a change of behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The simulation or workflow that needs the feature, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream equivalent
      description: The C++ Akantu class, function or input-file keyword that does this, if one exists, and its parity row in docs/FEATURE_PARITY.md.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Say whether it would change existing results or defaults.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you implement it?
      options:
        - "Yes, with guidance"
        - "Maybe"
        - "No"

# SPDX-License-Identifier: LGPL-3.0-or-later
name: Bug report
description: akantu-rs crashes, refuses valid input, or behaves differently from its documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a result that differs from C++ Akantu, use the form "Difference from C++ Akantu".
        For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Paste error messages as text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest program or script, input file (.dat) and mesh that show the problem. Attach files or paste them.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: akantu-rs version or commit
      placeholder: "0.1.0, or the output of git rev-parse HEAD"
    validations:
      required: true
  - type: input
    id: features
    attributes:
      label: Cargo features or Python wheel
      placeholder: "default; or --features mpi,mumps; or the wheel built from commit ..."
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, CPU architecture, Rust version (rustc -V), Python version if relevant, number of MPI ranks if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and other context
      render: text

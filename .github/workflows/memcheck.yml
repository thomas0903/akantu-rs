# SPDX-License-Identifier: LGPL-3.0-or-later
# akantu-rs CI: valgrind memcheck of the FFI `unsafe` code (row CI-010),
# weekly and on manual dispatch. The real-MPI acceptance binaries, the
# MUMPS, Scotch and PETSc bindings, the libm FFI and the C ABI, in the
# project images plus valgrind (docker/memcheck). Memcheck slows the
# programs 20 to 50 times. ASan is not used: it would need nightly
# -Zbuild-std and instrumented native libraries (ci/tiers/memcheck.sh).
name: memcheck
on:
  schedule:
    - cron: "17 5 * * 6"
  workflow_dispatch:
permissions:
  contents: read
env:
  # Container caps of scripts/mpi/in-docker.sh. The defaults (4 CPUs / 6g) fit
  # the standard runner of a public repository (4 vCPU / 16 GB); on a
  # private repository's 2-vCPU runner set the repository variable
  # AKANTU_RS_DOCKER_CPUS=2 (ci/github/README.md, "Runners and their limits").
  AKANTU_RS_DOCKER_CPUS: ${{ vars.AKANTU_RS_DOCKER_CPUS || '4' }}
  AKANTU_RS_DOCKER_MEMORY: ${{ vars.AKANTU_RS_DOCKER_MEMORY || '6g' }}
concurrency:
  group: memcheck-${{ github.ref }}
  cancel-in-progress: false
jobs:
  memcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        kind: [mpi, mumps, petsc]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Free disk space on the runner (project images and the cargo target volume are large)
        run: ci/github/free-disk.sh
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/akantu-images
          key: images-v3-mpi-scotch-mumps-petsc-${{ hashFiles('docker/mpi/Dockerfile', 'docker/scotch/Dockerfile', 'docker/mumps/Dockerfile', 'docker/petsc/Dockerfile') }}
      - run: ci/github/images.sh ~/akantu-images mpi scotch mumps petsc
      - name: valgrind memcheck (${{ matrix.kind }})
        env:
          CI_MEMCHECK_KIND: ${{ matrix.kind }}
        run: ci/run-all.sh --backend docker --tiers memcheck --out "$RUNNER_TEMP/ci-out"
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ci-memcheck-${{ matrix.kind }}
          path: ${{ runner.temp }}/ci-out
          retention-days: 14

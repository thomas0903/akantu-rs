# SPDX-License-Identifier: LGPL-3.0-or-later
# akantu-rs CI: manual dispatch only. The MPI and parallel-model tiers at 8
# ranks (oversubscribed) and Miri (Stacked and Tree Borrows) on the `unsafe`
# code. Run it before a release and after a change to `unsafe` code
# (docs/MAINTAINING.md). Benchmarks are not here (docs/BENCHMARKS.md).
name: expensive
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Container caps of scripts/mpi/in-docker.sh. The defaults (4 CPUs / 6g) fit
  # the standard runner of a public repository (4 vCPU / 16 GB); on a
  # private repository's 2-vCPU runner set the repository variable
  # AKANTU_RS_DOCKER_CPUS=2 (ci/github/README.md, "Runners and their limits").
  AKANTU_RS_DOCKER_CPUS: ${{ vars.AKANTU_RS_DOCKER_CPUS || '4' }}
  AKANTU_RS_DOCKER_MEMORY: ${{ vars.AKANTU_RS_DOCKER_MEMORY || '6g' }}
concurrency:
  group: expensive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ranks-8:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space on the runner (project images and the cargo target volume are large)
        run: ci/github/free-disk.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/akantu-images
          key: images-v3-mpi-scotch-mumps-${{ hashFiles('docker/mpi/Dockerfile', 'docker/scotch/Dockerfile', 'docker/mumps/Dockerfile') }}
      - run: ci/github/images.sh ~/akantu-images mpi scotch mumps
      - run: ci/run-all.sh --backend docker --preset expensive --out "$RUNNER_TEMP/ci-out"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-expensive
          path: ${{ runner.temp }}/ci-out
          retention-days: 14
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cargo registry (crate archives and index, keyed by Cargo.lock)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - env:
          CI_INSTALL_TOOLCHAINS: "1"
        run: ci/run-all.sh --backend host --preset miri --out "$RUNNER_TEMP/ci-out"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-miri
          path: ${{ runner.temp }}/ci-out
          retention-days: 14
